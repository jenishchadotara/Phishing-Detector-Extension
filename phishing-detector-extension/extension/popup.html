<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI CyberShield</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(18, 26, 43, 0.85);
      --accent-cyan: #00f2fe;
      --accent-glow: rgba(0, 242, 254, 0.4);
      --danger-red: #ff0055;
      --danger-glow: rgba(ff, 0, 85, 0.5);
      --safe-green: #00ff66;
      --safe-glow: rgba(0, 255, 102, 0.4);
      --text-main: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      background: var(--bg-color);
      font-family: 'Rajdhani', sans-serif;
      color: var(--text-main);
      padding: 16px;
      overflow: hidden;
      background-image: radial-gradient(circle at top right, rgba(0, 242, 254, 0.1), transparent 60%);
    }

    /* Container Card with Glassmorphism */
    .shield-container {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 242, 254, 0.2);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      position: relative;
    }

    /* Header Styling */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 10px;
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 0 0 8px var(--accent-glow);
    }

    .live-badge {
      font-size: 10px;
      background: rgba(0, 255, 102, 0.15);
      color: var(--safe-green);
      border: 1px solid var(--safe-green);
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: 700;
      animation: pulse 2s infinite;
    }

    /* Target Domain Display */
    .target-box {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 8px;
      padding: 8px 12px;
      border: 1px dashed rgba(255, 255, 255, 0.15);
      margin-bottom: 16px;
    }

    .target-label {
      font-size: 10px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .target-url {
      font-size: 12px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    /* Circular Score / Status Display */
    .status-section {
      text-align: center;
      margin: 10px 0 18px 0;
    }

    .shield-icon-glow {
      width: 70px;
      height: 70px;
      margin: 0 auto 10px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      background: rgba(0, 242, 254, 0.1);
      border: 2px solid var(--accent-cyan);
      box-shadow: 0 0 15px var(--accent-glow);
      transition: all 0.4s ease;
    }

    .status-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .sub-status {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }

    /* Futuristic Scan Button */
    .scan-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      border: none;
      border-radius: 8px;
      color: #000;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 15px var(--accent-glow);
      transition: all 0.3s ease;
      text-transform: uppercase;
    }

    .scan-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px var(--accent-cyan);
    }

    /* Dynamic UI States */
    .state-safe .shield-icon-glow {
      border-color: var(--safe-green);
      background: rgba(0, 255, 102, 0.1);
      box-shadow: 0 0 20px var(--safe-glow);
      color: var(--safe-green);
    }
    .state-safe .status-text { color: var(--safe-green); }

    .state-danger .shield-icon-glow {
      border-color: var(--danger-red);
      background: rgba(255, 0, 85, 0.1);
      box-shadow: 0 0 20px var(--danger-glow);
      color: var(--danger-red);
    }
    .state-danger .status-text { color: var(--danger-red); }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="shield-container" id="container">
    <div class="header">
      <div class="brand-title">⚡ CYBERSHIELD AI</div>
      <div class="live-badge">SYSTEM ACTIVE</div>
    </div>

    <div class="target-box">
      <div class="target-label">Target Page</div>
      <div class="target-url" id="targetUrl">Fetching current URL...</div>
    </div>

    <div class="status-section">
      <div class="shield-icon-glow" id="statusIcon">🛡️</div>
      <div class="status-text" id="statusText">READY TO SCAN</div>
      <div class="sub-status" id="subStatus">Click below for AI Threat Analysis</div>
    </div>

    <button class="scan-btn" id="scanBtn">LAUNCH AI SCAN</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
